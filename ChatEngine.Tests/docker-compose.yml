version: '3.8'
services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: meilisearch_test
    ports:
      - "7701:7700"
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=masterKey123_ChangeMeInProd!
    
  seaweedfs:
    image: chrislusf/seaweedfs:4.42
    container_name: marketplace_storage_test
    command: >
      server -dir=/data -s3
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=512
      -volume.max=30
    ports:
      - "1112:8333"   # S3 API (already have this)
      - "8889:8888"   # Filer UI — browse files like a folder tree
      - "9339:9333"
    volumes:
      - ./storage/s3.json:/etc/seaweedfs/s3.json:ro
      
  storage-init:
    image: amazon/aws-cli
    container_name: storage_init_test
    depends_on: [seaweedfs]
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "
      until aws --endpoint-url http://seaweedfs:8333 s3 ls; do sleep 2; done;
      aws --endpoint-url http://seaweedfs:8333 s3 mb s3://marketplace || true;
      aws --endpoint-url http://seaweedfs:8333 s3 cp /assets s3://marketplace/defaults --recursive"