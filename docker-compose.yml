version: '3.8'
services:
  chat-db:
    image: postgres:16-alpine
    container_name: chat_postgres_db
    environment:
      POSTGRES_USER: lenard_admin
      POSTGRES_PASSWORD: super_secure_password123
      POSTGRES_DB: chat_system_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chat-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: meilisearch_dev
    ports:
      - "7700:7700"
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=masterKey123_ChangeMeInProd!
    volumes:
      - meili_data:/meili_data
    networks:         
      - chat-network

  chat-api:
    image: chat-api-service
    container_name: chat_backend_api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - Jwt__Key=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Hashids__HasherSalt=${HASHID_SALT}
      - Hashids__MinHashLength=${Hashids__MinHashLength}
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=chat-db;Port=5432;Database=chat_system_db;Username=lenard_admin;Password=super_secure_password123
      - MeiliSearch__Url=${MEILISEARCH__URL}
      - MeiliSearch__MasterKey=${MEILISEARCH__MASTERKEY}
    depends_on:
      - chat-db
    networks:
      - chat-network
  
  seaweedfs:
    image: chrislusf/seaweedfs:4.42
    container_name: marketplace_storage
   
    command: >
      server -dir=/data -s3
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=512
      -volume.max=30
    ports:
      - "8333:8333"   # S3 API (already have this)
      - "8888:8888"   # Filer UI — browse files like a folder tree
      - "9333:9333"
    volumes:
      - seaweed_data:/data
      - ./storage/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - chat-network

  storage-init:
    image: amazon/aws-cli
    depends_on: [seaweedfs]
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./default-assets:/assets:ro   # put profile.png and product.png here
    entrypoint: >
      sh -c "
      until aws --endpoint-url http://seaweedfs:8333 s3 ls; do sleep 2; done;
      aws --endpoint-url http://seaweedfs:8333 s3 mb s3://marketplace || true;
      aws --endpoint-url http://seaweedfs:8333 s3 cp /assets s3://marketplace/defaults --recursive"
    networks:
      - chat-network

volumes:
  postgres_data:
  meili_data:
  seaweed_data:

networks:
  chat-network: